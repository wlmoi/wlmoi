<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07121e">
<title>William Anthony - Contribution City</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07121e;color:#effaf7;font:15px system-ui,sans-serif}header{padding:32px 5vw;position:relative;z-index:2;pointer-events:none}a,button,input{pointer-events:auto}header p{color:#6be6bf;font-size:12px;letter-spacing:3px}h1{font-size:clamp(27px,5vw,54px);margin:12px 0}header span{color:#9cb3c8}a{color:#9cf4d7;text-decoration:none}canvas{display:block;width:100%;height:65vh;min-height:350px;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.controls{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding:16px 5vw 32px;color:#9cb3c8;font-size:13px}button{background:#102e39;border:1px solid #2e766e;color:#b4ffe5;padding:10px 18px;border-radius:22px;cursor:pointer}input{accent-color:#63e6c1;vertical-align:middle;width:120px}#tip{position:fixed;pointer-events:none;display:none;padding:10px 14px;background:#102536;border:1px solid #2e766e;border-radius:10px;font-size:13px;z-index:4}#status{display:block;margin-top:12px}details{margin:0 5vw 32px;color:#9cb3c8}summary{cursor:pointer}td,th{text-align:left;padding:6px 18px 6px 0}table{font-size:13px}#table-wrap{max-height:260px;overflow:auto}button:focus-visible,a:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid #9cf4d7;outline-offset:4px}
</style>
<header><p>GITHUB CONTRIBUTION CITY</p><h1>William Anthony</h1><span>@wlmoi - A year of building, one day at a time.</span><span id="status" role="status">Loading GitHub activity...</span></header>
<canvas tabindex="0" aria-label="3D contribution city. Drag to rotate, use arrow keys to rotate, plus and minus to zoom, or use the controls below."></canvas>
<div class="controls"><button id="reset">Reset view</button><label>Rotate <input id="rotate" type="range" min="-180" max="180" value="-25"></label><label>Zoom <input id="zoom" type="range" min="50" max="180" value="100"></label><span>Drag to rotate - Scroll to zoom - Hover for daily details</span><a href="https://github.com/wlmoi?tab=overview" target="_blank" rel="noopener noreferrer">View on GitHub &#8599;</a></div>
<details><summary>Read the contribution data as a table</summary><div id="table-wrap"><table><thead><tr><th scope="col">Date</th><th scope="col">Contributions</th></tr></thead><tbody id="days"></tbody></table></div></details>
<div id="tip" role="status"></div>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),tip=document.querySelector('#tip'),rotation=document.querySelector('#rotate'),zoom=document.querySelector('#zoom');
let data=[],angle=-25*Math.PI/180,scale=1,tilt=.54,drag=null,faces=[],w=0,h=0;
const colors=['#1b3046','#176c73','#159b91','#3bceb1','#a0ffe0'];
const levels={NONE:0,FIRST_QUARTILE:1,SECOND_QUARTILE:2,THIRD_QUARTILE:3,FOURTH_QUARTILE:4};
function project(x,z,y){const a=x*Math.cos(angle)-z*Math.sin(angle),b=x*Math.sin(angle)+z*Math.cos(angle);return [w/2+a*scale,h*.64+(b*tilt-y)*scale]}
function draw(){
 const box=canvas.getBoundingClientRect();w=box.width;h=box.height;const dpr=Math.min(devicePixelRatio,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);faces=[];
 const glow=ctx.createRadialGradient(w*.5,h*.55,0,w*.5,h*.55,w*.5);glow.addColorStop(0,'#103b3b');glow.addColorStop(1,'#07121e');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
 if(!data.length)return;
 const peak=Math.max(1,...data.map(d=>d.contributionCount));const unit=Math.min(w/65,17);let blocks=data.map((d,i)=>{const x=(d.week-26)*unit,z=(d.weekday-3)*unit;return {d,x,z,depth:x*Math.sin(angle)+z*Math.cos(angle),height:d.contributionCount?6+Math.sqrt(d.contributionCount/peak)*100:1.5}}).sort((a,b)=>a.depth-b.depth);
 for(const b of blocks){const {x,z,height:y,d}=b,s=unit*.79,c=colors[levels[d.contributionLevel]];const corners=[[x,z],[x+s,z],[x+s,z+s],[x,z+s]],top=corners.map(([a,b])=>project(a,b,y)),bottom=corners.map(([a,b])=>project(a,b,0));let sides=[0,1,2,3].map(i=>({points:[bottom[i],bottom[(i+1)%4],top[(i+1)%4],top[i]],depth:(corners[i][0]+corners[(i+1)%4][0])*Math.sin(angle)+(corners[i][1]+corners[(i+1)%4][1])*Math.cos(angle),alpha:i%2?.65:.4})).sort((a,b)=>a.depth-b.depth);
 for(const f of [...sides,{points:top,alpha:1}]){ctx.beginPath();f.points.forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b));ctx.closePath();ctx.fillStyle=c;ctx.globalAlpha=f.alpha;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#071723';ctx.lineWidth=.7;ctx.stroke();faces.push({path:new Path2D(ctxPath(f.points)),day:d})}}
}
function ctxPath(points){return points.map(([x,y],i)=>(i?'L':'M')+x+' '+y).join(' ')+'Z'}
function sync(){rotation.value=Math.round(angle*180/Math.PI);zoom.value=Math.round(scale*100);draw()}
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);tip.style.display='none'});
canvas.addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-drag.x)*.007;tilt=Math.max(.25,Math.min(.85,tilt+(e.clientY-drag.y)*.003));drag={x:e.clientX,y:e.clientY};angle=Math.atan2(Math.sin(angle),Math.cos(angle));sync();return}const r=canvas.getBoundingClientRect();const hit=[...faces].reverse().find(f=>ctx.isPointInPath(f.path,(e.clientX-r.left)*Math.min(devicePixelRatio,2),(e.clientY-r.top)*Math.min(devicePixelRatio,2)));if(hit){tip.textContent=hit.day.date+' - '+hit.day.contributionCount+' contributions';tip.style.display='block';tip.style.left=Math.max(8,Math.min(innerWidth-260,e.clientX+14))+'px';tip.style.top=Math.min(innerHeight-52,e.clientY+14)+'px'}else tip.style.display='none'});
function release(){drag=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('pointerleave',()=>tip.style.display='none');
canvas.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.5,Math.min(1.8,scale-e.deltaY*.001));sync()},{passive:false});
canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-','='].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')angle-=.1;if(e.key==='ArrowRight')angle+=.1;if(e.key==='ArrowUp')tilt=Math.min(.85,tilt+.04);if(e.key==='ArrowDown')tilt=Math.max(.25,tilt-.04);if(['+','='].includes(e.key))scale=Math.min(1.8,scale+.1);if(e.key==='-')scale=Math.max(.5,scale-.1);sync()});
rotation.oninput=()=>{angle=Number(rotation.value)*Math.PI/180;draw()};zoom.oninput=()=>{scale=Number(zoom.value)/100;draw()};document.querySelector('#reset').onclick=()=>{angle=-25*Math.PI/180;tilt=.54;scale=1;sync()};new ResizeObserver(draw).observe(canvas);
fetch('./contributions.json').then(r=>{if(!r.ok)throw Error('data unavailable');return r.json()}).then(payload=>{const first=new Date(payload.days[0].date+'T00:00:00Z');data=payload.days.map(d=>({...d,week:Math.floor(((new Date(d.date+'T00:00:00Z')-first)/86400000+first.getUTCDay())/7)}));document.querySelector('#status').textContent=payload.total.toLocaleString()+' contributions - '+payload.days[0].date+' to '+payload.days.at(-1).date;const tbody=document.querySelector('#days');for(const d of [...data].reverse()){const row=document.createElement('tr');for(const v of [d.date,d.contributionCount]){const td=document.createElement('td');td.textContent=v;row.append(td)}tbody.append(row)}draw()}).catch(()=>{document.querySelector('#status').textContent='Contribution data could not be loaded. Please try again or view the profile on GitHub.'});
</script>
</html>
